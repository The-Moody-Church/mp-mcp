services:
  mp-mcp:
    # Image channels:
    #   :latest        — most recent stable release (default, recommended)
    #   :0, :0.2       — pin to a major / minor; auto-picks up patch releases
    #   :0.2.0         — pin to an exact release (immutable)
    #   :main          — most recent commit on main (post-merge testing)
    #   :dev           — most recent commit on any feature branch (PR preview)
    #   :sha-abc1234   — pin to a specific commit (immutable)
    #
    # Restarting to pick up a new image is non-disruptive — Claude clients
    # reconnect to the MCP server on the next tool call.
    image: ghcr.io/the-moody-church/mp-mcp:latest
    # Or build locally:
    # build: .
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./config/table-access.json:/app/config/table-access.json:ro
      # Optional: persist tool-invocation logs outside the container.
      # Pair with TOOL_LOG_PATH=/app/data/tool-invocations.jsonl in .env.
      - ./data:/app/data
    restart: unless-stopped

# Optional: attach to a shared Docker network instead of publishing port 3000.
# Use this if your reverse proxy runs as a container on the same host — the
# proxy can then reach mp-mcp at http://mp-mcp:3000 via the shared network.
# When enabled, also remove the `ports:` stanza above. See README → Networking.
#
#     networks:
#       - cloudflared
#
# networks:
#   cloudflared:
#     external: true
#     name: cloudflared_containers   # change to your reverse-proxy network
