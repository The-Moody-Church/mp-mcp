services:
  mp-mcp:
    # Image channels:
    #   :latest        — most recent stable release (recommended for production)
    #   :0, :0.2       — pinned major / minor of latest stable release
    #   :0.2.0         — pinned exact release
    #   :dev           — most recent commit on main (bleeding edge, may break)
    #   :sha-abc1234   — pinned to a specific commit (immutable)
    image: ghcr.io/the-moody-church/mp-mcp:latest
    # Or build locally:
    # build: .
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./config/table-access.json:/app/config/table-access.json:ro
      # Optional: persist tool-invocation logs outside the container.
      # Pair with TOOL_LOG_PATH=/app/data/tool-invocations.jsonl in .env.
      - ./data:/app/data
    restart: unless-stopped
